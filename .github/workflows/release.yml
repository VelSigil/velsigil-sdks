# Release of all four SDKs, started by pushing a tag vX.Y.Z that points to a commit on main (docs/RELEASING.md).
#
#   build --> attest --+--> publish-npm    (environment "npm":   npm stage publish; approve the staged package with 2FA)
#                      +--> publish-pypi   (environment "pypi":  PyPI trusted publishing + PEP 740 attestations)
#                      +--> publish-nuget  (environment "nuget": NuGet trusted publishing, 1-hour API key)
#                      +--> github-release (environment "github-release": C++ source tarball, SBOMs, SHA256SUMS,
#                                           attestation bundle)
#
# Nothing here holds a stored credential: every registry is reached through OIDC trusted publishing, bound on the
# registry side to this repository, this workflow file (release.yml) and the job's environment. Every environment,
# including github-release (an immutable public release cannot be withdrawn), requires the owner's approval and
# accepts only v* tags (GitHub Settings > Environments). The build job has no secrets and no write permission; only
# the job that creates the GitHub release can write to the repository. The SHA-256 of SHA256SUMS travels from the
# build job to every later job as a job output, not inside the artifact, so a swapped artifact cannot bring its own
# matching checksum file. No job reads or writes the Actions cache (cache-mode: none, plus every setup action with
# caching off).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

cache-mode: none

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  build:
    name: Build, test and checksum every package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sums: ${{ steps.files.outputs.sums }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # all branches: the tag's commit must be on origin/main
          persist-credentials: false
      - name: The tag must point to a commit on main
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == "tag" ]] || { echo "::error::release.yml publishes tags only (got $GITHUB_REF)"; exit 1; }
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on main; refusing to release."
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: csharp/global.json
      - name: The tag names the version of every SDK
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: node .github/scripts/check-versions.mjs --tag "$TAG" --github-output
      - name: Reproducible timestamps (SOURCE_DATE_EPOCH = commit time)
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: npm package (velsigil-client-<version>.tgz)
        working-directory: node
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm test
          npm run build
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/dist"

      - name: Python sdist + wheel (hash-pinned build tools, no build isolation)
        run: |
          set -euo pipefail
          python -m pip install --require-hashes -r .github/requirements/build-requirements.txt
          python -m pip install --require-hashes -r .github/requirements/test-requirements-latest.txt
          (cd python && python -m unittest discover -s tests -t .)
          python -m build --no-isolation --sdist --wheel --outdir "$RUNNER_TEMP/dist" python

      - name: NuGet package + symbols (locked restore, deterministic CI build, Source Link)
        working-directory: csharp
        run: |
          set -euo pipefail
          dotnet restore Velsigil.Client.sln --locked-mode
          dotnet build Velsigil.Client.sln -c Release --no-restore
          dotnet test tests/Velsigil.Client.Tests -c Release --no-build
          dotnet pack src/Velsigil.Client -c Release --no-build -o "$RUNNER_TEMP/dist"

      - name: C++ source tarball (deterministic)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bash .github/scripts/cpp-source-tarball.sh "$VERSION" "$RUNNER_TEMP/dist"

      - name: CycloneDX SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node .github/scripts/sbom.mjs "$VERSION" "$RUNNER_TEMP/dist"

      - name: Exactly the expected files, SHA256SUMS, job summary
        id: files
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/dist"
          expected=(
            "velsigil-client-$VERSION.tgz"
            "velsigil_client-$VERSION.tar.gz"
            "velsigil_client-$VERSION-py3-none-any.whl"
            "Velsigil.Client.$VERSION.nupkg"
            "Velsigil.Client.$VERSION.snupkg"
            "velsigil-cpp-$VERSION.tar.gz"
            "velsigil-client-npm-$VERSION.cdx.json"
            "velsigil-client-pypi-$VERSION.cdx.json"
            "Velsigil.Client-nuget-$VERSION.cdx.json"
            "velsigil-cpp-$VERSION.cdx.json"
          )
          for f in "${expected[@]}"; do [[ -f "$f" ]] || { echo "::error::missing release file $f"; exit 1; }; done
          extra="$(ls -1A | grep -vxF -f <(printf '%s\n' "${expected[@]}") || true)"
          [[ -z "$extra" ]] || { echo "::error::unexpected files in the release: $extra"; exit 1; }
          sha256sum "${expected[@]}" > SHA256SUMS
          sums="$(sha256sum SHA256SUMS | cut -d' ' -f1)"
          [[ "$sums" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::could not hash SHA256SUMS"; exit 1; }
          echo "sums=$sums" >> "$GITHUB_OUTPUT"
          {
            echo "### Velsigil SDKs $VERSION"
            echo
            echo "Commit \`$GITHUB_SHA\`, SOURCE_DATE_EPOCH $SOURCE_DATE_EPOCH. SHA-256 of every release file:"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "SHA-256 of SHA256SUMS itself (checked by every later job): \`$sums\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          # Longer than a deployment may wait for approval (30 days), e.g. pypi while PyPI's approval is pending.
          retention-days: 35

  # ---------------------------------------------------------------------------------------------------------------
  attest:
    name: Build provenance attestation (all files)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write # Sigstore signing certificate for the attestation (OIDC)
      attestations: write # store the attestation in this repository (gh attestation verify)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify SHA256SUMS (against the build job's output) and every file
        working-directory: dist
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          set -euo pipefail
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the build job"; exit 1; }
          echo "$SUMS  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
      - name: Attest every file listed in SHA256SUMS
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Keep the attestation bundle for the GitHub release
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p attestation
          cp "$BUNDLE" "attestation/velsigil-sdks-$VERSION.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-attestation
          path: attestation/
          if-no-files-found: error
          retention-days: 35

  # ---------------------------------------------------------------------------------------------------------------
  # npm: the trusted publisher allows ONLY `npm stage publish`. The package becomes public when the owner approves the
  # staged version with 2FA (npmjs.com > Staged Packages, or `npm stage approve <stage-id>`).
  publish-npm:
    name: npm (staged; approve with 2FA)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm
      url: https://www.npmjs.com/package/velsigil-client
    permissions:
      id-token: write # npm trusted publishing (OIDC) and npm provenance
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify SHA256SUMS (against the build job's output) and every file
        working-directory: dist
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          set -euo pipefail
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the build job"; exit 1; }
          echo "$SUMS  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: npm supports staged publishing with OIDC (npm >= 11.15.0, Node >= 22.14.0)
        run: |
          set -euo pipefail
          echo "node $(node --version), npm $(npm --version)"
          node -e '
            const at = (v) => v.replace(/^v/, "").split(".").map(Number);
            const ge = (a, b) => { for (let i = 0; i < 3; i++) { if (a[i] !== b[i]) return a[i] > b[i]; } return true; };
            if (!ge(at(process.argv[1]), [11, 15, 0]) || !ge(at(process.version), [22, 14, 0])) { console.error("::error::npm >= 11.15.0 and Node >= 22.14.0 are required for npm stage publish with trusted publishing"); process.exit(1); }
          ' "$(npm --version)"
      - name: npm stage publish (from the built tarball, with provenance)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: npm stage publish "./dist/velsigil-client-$VERSION.tgz" --access public --provenance
      - name: How to approve
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          {
            echo "### velsigil-client@$VERSION is STAGED, not yet public"
            echo
            echo "Approve it with 2FA: npmjs.com > Staged Packages > velsigil-client $VERSION > Approve,"
            echo "or on your PC: \`npm stage list velsigil-client\`, then \`npm stage approve <stage-id>\`."
            echo "Check first: \`npm stage download <stage-id>\` and compare its SHA-256 with SHA256SUMS of this run."
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------------------------------------------
  # PyPI: trusted publisher (initially a "pending publisher" for project velsigil-client) bound to this repository,
  # release.yml and environment "pypi". If PyPI is not ready when a version is tagged, leave this job's deployment
  # waiting (the other jobs are unaffected) and approve it once the pending publisher exists, within 30 days.
  publish-pypi:
    name: PyPI (trusted publishing + attestations)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/velsigil-client/
    permissions:
      id-token: write # PyPI trusted publishing (OIDC) and PEP 740 attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify SHA256SUMS (against the build job's output) and every file, select the Python distributions
        env:
          VERSION: ${{ needs.build.outputs.version }}
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          set -euo pipefail
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the build job"; exit 1; }
          (cd dist && echo "$SUMS  SHA256SUMS" | sha256sum --check --strict && sha256sum --check --strict SHA256SUMS)
          mkdir -p pypi-dist
          cp "dist/velsigil_client-$VERSION.tar.gz" "dist/velsigil_client-$VERSION-py3-none-any.whl" pypi-dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-dist/
          attestations: true
          print-hash: true

  # ---------------------------------------------------------------------------------------------------------------
  # nuget.org: trusted publishing policy for package Velsigil.Client ("Push new packages and package versions",
  # unlisting not allowed). NuGet/login exchanges the OIDC token for an API key valid for one hour.
  publish-nuget:
    name: nuget.org (trusted publishing)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Velsigil.Client
    permissions:
      id-token: write # NuGet trusted publishing: OIDC token exchanged for a short-lived API key
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify SHA256SUMS (against the build job's output) and every file
        working-directory: dist
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          set -euo pipefail
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the build job"; exit 1; }
          echo "$SUMS  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: velsigil-client
      - name: dotnet nuget push (.nupkg, then .snupkg)
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          dotnet nuget push "dist/Velsigil.Client.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --no-symbols
          dotnet nuget push "dist/Velsigil.Client.$VERSION.snupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json

  # ---------------------------------------------------------------------------------------------------------------
  # GitHub release (turn on immutable releases: Settings > General > Releases). The only job with write access. It
  # waits for the owner's approval in environment "github-release" (no registry is bound to it): an immutable release
  # is public at once and locks the tag, so a bad build must be stoppable here as well.
  github-release:
    name: GitHub release (C++ source, SBOMs, checksums, attestation)
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-release
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-attestation
          path: attestation
      - name: Verify SHA256SUMS (against the build job's output) and every file
        working-directory: dist
        env:
          SUMS: ${{ needs.build.outputs.sums }}
        run: |
          set -euo pipefail
          [[ "$SUMS" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::no SHA256SUMS digest from the build job"; exit 1; }
          echo "$SUMS  SHA256SUMS" | sha256sum --check --strict
          sha256sum --check --strict SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          repo="https://github.com/${GITHUB_REPOSITORY}"
          {
            printf '%s\n' "Velsigil SDKs $VERSION, built from commit $GITHUB_SHA by release.yml."
            printf '\n%s\n' "Packages (submitted to the registries by this release's workflow run; each registry publishes a version after the owner approves it, so one may appear later than this release):"
            printf '%s\n' "- npm: velsigil-client $VERSION (https://www.npmjs.com/package/velsigil-client/v/$VERSION)"
            printf '%s\n' "- PyPI: velsigil-client $VERSION (https://pypi.org/project/velsigil-client/$VERSION/)"
            printf '%s\n' "- NuGet: Velsigil.Client $VERSION (https://www.nuget.org/packages/Velsigil.Client/$VERSION)"
            printf '%s\n' "- C++: velsigil-cpp-$VERSION.tar.gz (attached; CMake FetchContent or find_package, see cpp/README.md)"
            printf '\n%s\n' "Attached: the C++ source tarball, a CycloneDX SBOM per package, SHA256SUMS of every file as built (use sha256sum --check --ignore-missing SHA256SUMS; nuget.org adds its repository signature to the .nupkg, so a .nupkg downloaded from nuget.org differs) and the Sigstore bundle of the build-provenance attestation."
            printf '%s\n' "Verify: gh attestation verify <file> --repo $GITHUB_REPOSITORY --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml --source-ref refs/tags/$TAG --deny-self-hosted-runners, and gh release verify-asset $TAG <file> --repo $GITHUB_REPOSITORY ($repo/blob/main/docs/VERIFYING.md)."
            printf '%s\n' "Changes: node/CHANGELOG.md, python/CHANGELOG.md, csharp/CHANGELOG.md, cpp/CHANGELOG.md."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Velsigil SDKs $VERSION" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/velsigil-cpp-$VERSION.tar.gz" \
            "dist/velsigil-cpp-$VERSION.cdx.json" \
            "dist/velsigil-client-npm-$VERSION.cdx.json" \
            "dist/velsigil-client-pypi-$VERSION.cdx.json" \
            "dist/Velsigil.Client-nuget-$VERSION.cdx.json" \
            dist/SHA256SUMS \
            "attestation/velsigil-sdks-$VERSION.sigstore.json"

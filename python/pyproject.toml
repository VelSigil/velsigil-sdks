[build-system]
# Pinned exactly so every build of a release uses the same backend (Dependabot proposes updates).
# setuptools >= 77 is needed for the SPDX `license` expression and `license-files` (PEP 639).
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velsigil-client"
version = "1.0.0"
description = "Official Python client for the Velsigil license server (Ed25519-verified license validation, offline leases, updates)."
readme = "README.md"
# 3.10 is the oldest CPython the cryptography floor below still ships wheels for that is not long past its end of
# life (3.9 ended 2025-10); drop it in a minor release once sellers have moved on.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Velsigil" }]
keywords = ["license", "licensing", "license-key", "ed25519", "velsigil"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# cryptography >= 50.0.0: the first release without a published advisory. 48.0.1 fixed the bundled OpenSSL
# (GHSA-537c-gmf6-5ccf; the Ed25519 checks of this SDK run in that OpenSSL); 49.0.0 and 50.0.0 fixed X.509 path
# building and name constraints (GHSA-jwv3-5hgf-82ww, GHSA-m2h6-j472-rp4c) and a PKCS#7 decryption oracle
# (GHSA-g6cj-pr64-35w5). This SDK never calls that code, but a floor without known advisories keeps installs of the
# SDK from pulling in a vulnerable cryptography (owner decision, 2026-10-08, before the first release).
dependencies = ["cryptography>=50.0.0"]

[project.optional-dependencies]
# PyNaCl >= 1.6.2 bundles a libsodium with the fix for GHSA-mrfv-m5wm-5w6w (Ed25519 input validation).
nacl = ["PyNaCl>=1.6.2"]

[project.urls]
Homepage = "https://github.com/VelSigil/velsigil-sdks/tree/main/python"
Documentation = "https://github.com/VelSigil/velsigil-sdks/blob/main/python/README.md"
Source = "https://github.com/VelSigil/velsigil-sdks"
Issues = "https://github.com/VelSigil/velsigil-sdks/issues"
Changelog = "https://github.com/VelSigil/velsigil-sdks/blob/main/python/CHANGELOG.md"
Security = "https://www.velsigil.com/security.html"

[tool.setuptools]
packages = ["velsigil_client"]

[tool.setuptools.package-data]
velsigil_client = ["py.typed"]

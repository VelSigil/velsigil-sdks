[build-system]
# Pinned for reproducible builds; needs >= 77 for the SPDX `license` field.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "velsigil-client"
version = "1.0.5"
description = "Official Python client for the Velsigil license server (Ed25519-verified license validation, offline leases, updates)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Velsigil" }]
keywords = ["license", "licensing", "license-key", "ed25519", "velsigil"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Floor at the first cryptography release without a published security advisory.
dependencies = ["cryptography>=50.0.0"]

[project.optional-dependencies]
# 1.6.2 bundles a libsodium with fixed Ed25519 input validation.
nacl = ["PyNaCl>=1.6.2"]

[project.urls]
Homepage = "https://github.com/VelSigil/velsigil-sdks/tree/main/python"
Documentation = "https://github.com/VelSigil/velsigil-sdks/blob/main/python/README.md"
Source = "https://github.com/VelSigil/velsigil-sdks"
Issues = "https://github.com/VelSigil/velsigil-sdks/issues"
Changelog = "https://github.com/VelSigil/velsigil-sdks/blob/main/python/CHANGELOG.md"
Security = "https://www.velsigil.com/security.html"

[tool.setuptools]
packages = ["velsigil_client"]

[tool.setuptools.package-data]
velsigil_client = ["py.typed"]
